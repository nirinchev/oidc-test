on:
  pull_request:
name: Test
jobs:
  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20.16.0

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: node index.js
